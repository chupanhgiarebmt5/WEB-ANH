<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CHỤP ẢNH GIÁ RẺ BMT STUDIO - Giao Ảnh Khách Hàng</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #FAF8F5;
      color: #18181B;
      -webkit-tap-highlight-color: transparent;
    }
    .font-serif-title {
      font-family: 'Cormorant Garamond', serif;
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-amber-600 selection:text-white">
  <div id="root"></div>

  <script type="module">
    import React, { useState, useEffect, useMemo } from "https://esm.sh/react@18.2.0";
    import { createRoot } from "https://esm.sh/react-dom@18.2.0/client";
    import {
      Heart, Download, Check, Share2, FolderPlus,
      Copy, Sparkles, X, ChevronLeft, ChevronRight,
      Smartphone, CheckSquare, Square, Loader2, Link2, Eye
    } from "https://esm.sh/lucide-react@0.292.0";

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import {
      getFirestore, collection, doc, setDoc, updateDoc, deleteDoc, onSnapshot, query
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const STUDIO_DISPLAY_NAME = "CHỤP ẢNH GIÁ RẺ BMT STUDIO";

    const firebaseConfig = {
      apiKey: "AIzaSyDFQZi30JoL4A873TntQCxYalRY2QPdcbI",
      authDomain: "chupanhgiare-e4807.firebaseapp.com",
      projectId: "chupanhgiare-e4807",
      storageBucket: "chupanhgiare-e4807.firebasestorage.app",
      messagingSenderId: "1008958227573",
      appId: "1:1008958227573:web:48c30862a2f6a57a74643c",
      measurementId: "G-1M9VCG29VC"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const DEFAULT_DRIVE_API_KEY = "AIzaSyArx0lpJ88MJE-gJFnyWwvAWHawsWIv_kc";

    const DEMO_ALBUMS = [
      {
        id: "demo-phu-quoc",
        title: "Album Cưới Minh & Lan - Phú Quốc",
        clientName: "Minh & Lan",
        studioName: STUDIO_DISPLAY_NAME,
        sourceType: "demo",
        date: "2026-11-18",
        coverUrl: "https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1200&q=85",
        favorites: ["PQ_001.JPG", "PQ_003.JPG"],
        photos: [
          { id: "p1", name: "PQ_001.JPG", thumbUrl: "https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=800&q=80", fullUrl: "https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1600&q=90" },
          { id: "p2", name: "PQ_002.JPG", thumbUrl: "https://images.unsplash.com/photo-1511285560929-80b456fea0bc?auto=format&fit=crop&w=800&q=80", fullUrl: "https://images.unsplash.com/photo-1511285560929-80b456fea0bc?auto=format&fit=crop&w=1600&q=90" },
          { id: "p3", name: "PQ_003.JPG", thumbUrl: "https://images.unsplash.com/photo-1520854221256-17451cc331bf?auto=format&fit=crop&w=800&q=80", fullUrl: "https://images.unsplash.com/photo-1520854221256-17451cc331bf?auto=format&fit=crop&w=1600&q=90" },
          { id: "p4", name: "PQ_004.JPG", thumbUrl: "https://images.unsplash.com/photo-1465495976277-4387d4b0b4c6?auto=format&fit=crop&w=800&q=80", fullUrl: "https://images.unsplash.com/photo-1465495976277-4387d4b0b4c6?auto=format&fit=crop&w=1600&q=90" },
          { id: "p5", name: "PQ_005.JPG", thumbUrl: "https://images.unsplash.com/photo-1537633552985-df8429e8048b?auto=format&fit=crop&w=800&q=80", fullUrl: "https://images.unsplash.com/photo-1537633552985-df8429e8048b?auto=format&fit=crop&w=1600&q=90" },
          { id: "p6", name: "PQ_006.JPG", thumbUrl: "https://images.unsplash.com/photo-1583939003579-730e3918a45a?auto=format&fit=crop&w=800&q=80", fullUrl: "https://images.unsplash.com/photo-1583939003579-730e3918a45a?auto=format&fit=crop&w=1600&q=90" }
        ]
      }
    ];

    function detectLinkType(url) {
      const clean = (url || "").trim();
      if (!clean) return null;
      if (clean.includes("photos.app.goo.gl") || clean.includes("photos.google.com")) {
        return "google_photos";
      }
      if (clean.includes("drive.google.com") || /^[a-zA-Z0-9_-]{20,}$/.test(clean)) {
        return "google_drive";
      }
      return "unknown";
    }

    function extractDriveFolderId(url) {
      if (!url) return null;
      const match1 = url.match(/\/folders\/([a-zA-Z0-9_-]+)/);
      if (match1) return match1[1];
      const match2 = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
      if (match2) return match2[1];
      if (/^[a-zA-Z0-9_-]{20,}$/.test(url.trim())) return url.trim();
      return null;
    }

    // Kiểm tra xem ảnh có thuộc Google Photos không
    function isGooglePhotoItem(photo) {
      const url = photo.fullUrl || photo.thumbUrl || "";
      return url.includes("googleusercontent.com");
    }

    // Lấy link tải gốc trực tiếp từ Google Photos (=d)
    function getGooglePhotoDirectDownloadUrl(photo) {
      const rawUrl = photo.fullUrl || photo.thumbUrl || "";
      const baseUrl = rawUrl.split("=")[0];
      return baseUrl + "=d";
    }

    function buildProxyUrl(photo) {
      if (photo.driveId) {
        return "/.netlify/functions/proxy?id=" + photo.driveId + "&name=" + encodeURIComponent(photo.name);
      }
      return photo.downloadUrl || photo.fullUrl;
    }

    function App() {
      const [urlAlbumId] = useState(() => {
        const params = new URLSearchParams(window.location.search);
        return params.get("album");
      });

      const [isAdminMode, setIsAdminMode] = useState(() => {
        const params = new URLSearchParams(window.location.search);
        return !params.get("album");
      });

      const [driveApiKey] = useState(() => {
        return localStorage.getItem("drive_api_key") || DEFAULT_DRIVE_API_KEY;
      });

      const [albums, setAlbums] = useState(DEMO_ALBUMS);
      const [activeAlbumId, setActiveAlbumId] = useState(urlAlbumId || DEMO_ALBUMS[0].id);
      const [selectedIds, setSelectedIds] = useState([]);
      const [filterTab, setFilterTab] = useState("all");
      const [lightboxIndex, setLightboxIndex] = useState(null);
      const [isSavingPhone, setIsSavingPhone] = useState(false);
      const [saveProgress, setSaveProgress] = useState({ current: 0, total: 0 });
      const [toastMsg, setToastMsg] = useState(null);
      const [deletingId, setDeletingId] = useState(null);

      const [newTitle, setNewTitle] = useState("");
      const [newClient, setNewClient] = useState("");
      const [newStudio] = useState(STUDIO_DISPLAY_NAME);
      const [sourceLink, setSourceLink] = useState("");
      const [isLoadingSource, setIsLoadingSource] = useState(false);

      const detectedType = useMemo(() => detectLinkType(sourceLink), [sourceLink]);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 5000);
      };

      useEffect(() => {
        signInAnonymously(auth).catch((err) => console.warn("Auth warning:", err.message));

        const q = query(collection(db, "albums"));
        const unsub = onSnapshot(q, (snapshot) => {
          const loaded = [];
          snapshot.forEach((docSnap) => {
            loaded.push({ id: docSnap.id, ...docSnap.data() });
          });
          loaded.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
          setAlbums([...loaded, ...DEMO_ALBUMS]);

          if (urlAlbumId && loaded.some((a) => a.id === urlAlbumId)) {
            setActiveAlbumId(urlAlbumId);
          }
        }, (err) => {
          console.warn("Firestore read note:", err.message);
        });

        return () => unsub();
      }, [urlAlbumId]);

      const currentAlbum = useMemo(() => {
        return albums.find((a) => a.id === activeAlbumId) || albums[0];
      }, [albums, activeAlbumId]);

      const filteredPhotos = useMemo(() => {
        if (!currentAlbum) return [];
        const favs = currentAlbum.favorites || [];
        return currentAlbum.photos.filter((p) => {
          if (filterTab === "selected") return selectedIds.includes(p.id);
          if (filterTab === "favorites") return favs.includes(p.name);
          return true;
        });
      }, [currentAlbum, filterTab, selectedIds]);

      const toggleSelect = (id, e) => {
        if (e) e.stopPropagation();
        setSelectedIds((prev) =>
          prev.includes(id) ? prev.filter((item) => item !== id) : [...prev, id]
        );
      };

      const toggleSelectAll = () => {
        if (selectedIds.length === filteredPhotos.length) {
          setSelectedIds([]);
        } else {
          setSelectedIds(filteredPhotos.map((p) => p.id));
        }
      };

      const toggleFavorite = async (photoName, e) => {
        if (e) e.stopPropagation();
        const currentFavs = currentAlbum.favorites || [];
        const updatedFavs = currentFavs.includes(photoName)
          ? currentFavs.filter((n) => n !== photoName)
          : [...currentFavs, photoName];

        setAlbums((prev) =>
          prev.map((alb) =>
            alb.id === currentAlbum.id ? { ...alb, favorites: updatedFavs } : alb
          )
        );

        if (!currentAlbum.id.startsWith("demo-")) {
          try {
            await updateDoc(doc(db, "albums", currentAlbum.id), {
              favorites: updatedFavs
            });
          } catch (err) {
            console.warn("Lỗi lưu tim:", err);
          }
        }
      };

      const handleDeleteAlbum = async (alb) => {
        if (alb.id.startsWith("demo-")) {
          showToast("Không thể xóa album mẫu mặc định!");
          return;
        }

        const confirmed = window.confirm(
          "Bạn có chắc chắn muốn xóa album \"" + alb.title + "\" không? (Ảnh gốc trên Drive / Google Photos vẫn giữ nguyên)"
        );
        if (!confirmed) return;

        setDeletingId(alb.id);
        try {
          await deleteDoc(doc(db, "albums", alb.id));
          setAlbums((prev) => prev.filter((item) => item.id !== alb.id));
          if (activeAlbumId === alb.id) {
            const remaining = albums.filter((item) => item.id !== alb.id);
            setActiveAlbumId(remaining[0]?.id || DEMO_ALBUMS[0].id);
            setSelectedIds([]);
          }
          showToast("Đã xóa album \"" + alb.title + "\"!");
        } catch (err) {
          alert("Lỗi khi xóa album: " + err.message);
        } finally {
          setDeletingId(null);
        }
      };

      const handleCreateAlbum = async (e) => {
        e.preventDefault();
        if (!newTitle.trim() || !sourceLink.trim()) {
          showToast("Vui lòng nhập Tên Album và dán Link Drive hoặc Google Photos!");
          return;
        }

        const linkType = detectLinkType(sourceLink);
        if (!linkType || linkType === "unknown") {
          showToast("Link không hợp lệ! Hãy dán link Google Drive hoặc link chia sẻ Google Photos.");
          return;
        }

        setIsLoadingSource(true);
        try {
          let photos = [];

          if (linkType === "google_drive") {
            const folderId = extractDriveFolderId(sourceLink);
            if (!folderId) {
              throw new Error("Không tìm thấy mã thư mục trong link Google Drive.");
            }

            const queryStr = encodeURIComponent("'" + folderId + "' in parents and mimeType contains 'image/' and trashed = false");
            const apiUrl = "https://www.googleapis.com/drive/v3/files?q=" + queryStr + "&fields=files(id,name,mimeType)&pageSize=500&orderBy=name&key=" + driveApiKey.trim();

            const res = await fetch(apiUrl);
            const data = await res.json();

            if (data.error) {
              throw new Error(data.error.message || "Không đọc được thư mục Drive.");
            }
            if (!data.files || data.files.length === 0) {
              throw new Error("Không tìm thấy ảnh nào! Hãy bật chia sẻ thư mục Drive sang 'Bất kỳ ai có đường liên kết'.");
            }

            photos = data.files.map((f) => ({
              id: f.id,
              name: f.name,
              driveId: f.id,
              thumbUrl: "https://drive.google.com/thumbnail?id=" + f.id + "&sz=w1000",
              fullUrl: "https://drive.google.com/thumbnail?id=" + f.id + "&sz=w2500",
              downloadUrl: "/.netlify/functions/proxy?id=" + f.id + "&name=" + encodeURIComponent(f.name)
            }));
          } else if (linkType === "google_photos") {
            const res = await fetch("/.netlify/functions/photos?url=" + encodeURIComponent(sourceLink.trim()));
            const data = await res.json();

            if (!res.ok || data.error) {
              throw new Error(data.error || "Không đọc được album Google Photos. Hãy kiểm tra lại link chia sẻ công khai.");
            }
            if (!data.photos || data.photos.length === 0) {
              throw new Error("Album Google Photos này chưa có ảnh hoặc chưa bật chia sẻ link.");
            }

            photos = data.photos.map((item, idx) => {
              const num = String(idx + 1).padStart(3, "0");
              const fileName = "IMG_" + num + ".JPG";
              const cleanBase = item.baseUrl.split("=")[0];
              return {
                id: "gp-" + idx + "-" + Date.now(),
                name: fileName,
                thumbUrl: cleanBase + "=w1000",
                fullUrl: cleanBase + "=w2500"
              };
            });
          }

          const slug = "alb-" + Date.now().toString(36);
          const newAlbumObj = {
            id: slug,
            title: newTitle.trim(),
            clientName: newClient.trim() || "Khách hàng",
            studioName: newStudio,
            sourceType: linkType,
            date: new Date().toISOString().split("T")[0],
            createdAt: Date.now(),
            coverUrl: photos[0].fullUrl,
            favorites: [],
            photos
          };

          await setDoc(doc(db, "albums", slug), newAlbumObj);
          setActiveAlbumId(slug);
          setIsAdminMode(false);
          setNewTitle("");
          setNewClient("");
          setSourceLink("");
          showToast("Đã tạo Album (" + photos.length + " ảnh)!");
        } catch (err) {
          alert("Lỗi kết nối: " + err.message);
        } finally {
          setIsLoadingSource(false);
        }
      };

      // TẢI TRỰC TIẾP TỪ TRÌNH DUYỆT CHO GOOGLE PHOTOS (TRÁNH BỊ GOOGLE CHẶN IP SERVER NETLIFY)
      const downloadGooglePhotosDirectly = async (gpList) => {
        for (let i = 0; i < gpList.length; i++) {
          const p = gpList[i];
          setSaveProgress({ current: i + 1, total: gpList.length });
          const downloadLink = getGooglePhotoDirectDownloadUrl(p);

          if (gpList.length === 1) {
            const a = document.createElement("a");
            a.href = downloadLink;
            a.download = p.name || "photo.jpg";
            a.rel = "noopener noreferrer";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
          } else {
            const iframe = document.createElement("iframe");
            iframe.style.display = "none";
            iframe.src = downloadLink;
            document.body.appendChild(iframe);
            setTimeout(() => {
              if (iframe.parentNode) iframe.parentNode.removeChild(iframe);
            }, 30000);
          }

          if (i < gpList.length - 1) {
            await new Promise((r) => setTimeout(r, 500));
          }
        }
      };

      const savePhotosToPhone = async (photosToSave) => {
        if (!photosToSave || photosToSave.length === 0) {
          showToast("Hãy tích chọn ít nhất 1 tấm ảnh để lưu!");
          return;
        }

        setIsSavingPhone(true);
        setSaveProgress({ current: 0, total: photosToSave.length });

        try {
          // Tách riêng ảnh Google Photos và ảnh Google Drive / Demo
          const googlePhotoItems = photosToSave.filter((p) => isGooglePhotoItem(p));
          const proxyItems = photosToSave.filter((p) => !isGooglePhotoItem(p));

          // 1. Xử lý Google Photos: Tải thẳng bằng IP người dùng qua tham số =d
          if (googlePhotoItems.length > 0) {
            await downloadGooglePhotosDirectly(googlePhotoItems);
            if (googlePhotoItems.length === 1) {
              showToast("Đang tải ảnh gốc " + googlePhotoItems[0].name + " về máy!");
            } else {
              showToast("Đang tải " + googlePhotoItems.length + " ảnh Google Photos! (Nếu trình duyệt hỏi cho phép tải nhiều tệp, hãy bấm Cho phép)");
            }
          }

          // 2. Xử lý Google Drive / Demo: Lấy Blob qua Proxy -> Lưu Album ĐT hoặc nén ZIP
          if (proxyItems.length > 0) {
            let completed = 0;
            const results = await Promise.all(
              proxyItems.map(async (p) => {
                const proxyUrl = buildProxyUrl(p);
                try {
                  const response = await fetch(proxyUrl);
                  if (!response.ok) throw new Error("Proxy status " + response.status);

                  const blob = await response.blob();
                  if (blob.size < 1000) throw new Error("Invalid image blob");

                  const fileName = /\.(jpg|jpeg|png|webp)$/i.test(p.name) ? p.name : p.name + ".jpg";
                  const file = new File([blob], fileName, { type: blob.type || "image/jpeg" });
                  completed++;
                  setSaveProgress({ current: completed, total: proxyItems.length });
                  return { ok: true, file, blob, fileName };
                } catch {
                  completed++;
                  setSaveProgress({ current: completed, total: proxyItems.length });
                  return { ok: false, photo: p };
                }
              })
            );

            const validItems = results.filter((r) => r.ok);
            if (validItems.length === 0) {
              throw new Error("Không tải được dữ liệu ảnh Drive từ máy chủ.");
            }

            const filesArray = validItems.map((r) => r.file);

            if (navigator.canShare && navigator.canShare({ files: filesArray })) {
              await navigator.share({
                files: filesArray,
                title: currentAlbum.title,
                text: "Lưu " + filesArray.length + " ảnh từ " + STUDIO_DISPLAY_NAME
              });
              showToast("Đã chuẩn bị " + filesArray.length + " ảnh! Bấm 'Lưu " + filesArray.length + " hình ảnh' trên bảng hiện ra.");
              return;
            }

            if (validItems.length === 1) {
              const item = validItems[0];
              const blobUrl = URL.createObjectURL(item.blob);
              const a = document.createElement("a");
              a.href = blobUrl;
              a.download = item.fileName;
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
              setTimeout(() => URL.revokeObjectURL(blobUrl), 5000);
              showToast("Đã tải ảnh " + item.fileName + " về máy!");
            } else if (window.JSZip) {
              const zip = new window.JSZip();
              const usedNames = new Set();
              validItems.forEach((item, idx) => {
                let name = item.fileName;
                if (usedNames.has(name)) {
                  name = (idx + 1) + "_" + name;
                }
                usedNames.add(name);
                zip.file(name, item.blob);
              });

              const zipBlob = await zip.generateAsync({ type: "blob" });
              const zipUrl = URL.createObjectURL(zipBlob);
              const a = document.createElement("a");
              a.href = zipUrl;
              const safeAlbumName = (currentAlbum.title || "Album_Anh").replace(/[^a-zA-Z0-9_\-\u00C0-\u1EF9 ]/g, "").trim() || "Album_Anh";
              a.download = safeAlbumName + "_" + validItems.length + "_anh.zip";
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
              setTimeout(() => URL.revokeObjectURL(zipUrl), 10000);
              showToast("Đã tải trọn bộ " + validItems.length + " ảnh gốc (file ZIP)!");
            }
          }
        } catch (err) {
          if (err.name !== "AbortError") {
            showToast("Lỗi tải ảnh: " + err.message);
          }
        } finally {
          setIsSavingPhone(false);
        }
      };

      const copyClientLink = (albumId) => {
        const link = window.location.origin + "/?album=" + albumId;
        navigator.clipboard.writeText(link);
        showToast("Đã copy Link gửi cho khách! Khách mở link sẽ chỉ thấy trang giao ảnh.");
      };

      const copyFavoriteNames = () => {
        const favs = currentAlbum?.favorites || [];
        if (favs.length === 0) {
          showToast("Khách chưa thả tim tấm ảnh nào!");
          return;
        }
        navigator.clipboard.writeText(favs.join(", "));
        showToast("Đã copy " + favs.length + " mã file ảnh để lọc trong Lightroom!");
      };

      return React.createElement("div", { className: "min-h-screen flex flex-col pb-24" },
        toastMsg && React.createElement("div", {
          className: "fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-zinc-900 text-white px-5 py-3 rounded-full shadow-2xl text-sm font-medium flex items-center gap-2 max-w-[92vw] text-center"
        },
          React.createElement(Sparkles, { className: "w-4 h-4 text-amber-400 shrink-0" }),
          React.createElement("span", null, toastMsg)
        ),

        !urlAlbumId && React.createElement("header", {
          className: "sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-stone-200 px-4 py-3 flex items-center justify-between gap-2"
        },
          React.createElement("div", { className: "flex items-center gap-2 min-w-0" },
            React.createElement("span", { className: "font-serif-title font-bold text-base sm:text-xl tracking-wider text-zinc-900 truncate" },
              STUDIO_DISPLAY_NAME
            ),
            React.createElement("span", { className: "text-[10px] sm:text-xs px-2 py-0.5 rounded-full bg-amber-100 text-amber-800 font-medium shrink-0" }, "PRO")
          ),
          React.createElement("div", { className: "flex items-center gap-2 shrink-0" },
            React.createElement("button", {
              onClick: () => setIsAdminMode(!isAdminMode),
              className: "px-3 sm:px-3.5 py-1.5 rounded-full text-xs font-semibold transition flex items-center gap-1.5 " + (
                isAdminMode ? "bg-zinc-900 text-white" : "bg-stone-100 text-zinc-800 hover:bg-stone-200"
              )
