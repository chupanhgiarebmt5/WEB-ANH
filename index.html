<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CHUPANHGIARE STUDIO - Giao Ảnh Khách Hàng</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    .font-serif-title {

    .hide-scrollbar::-webkit-scrollbar {

    }
    .hide-scrollbar {

    }

    @media (min-width: 640px) {

    @media (min-width: 1024px) {

    .masonry-item {

      margin-bottom: 10px;

    @media (min-width: 640px) {

    @media (min-width: 1024px) {
      .masonry-item {
        margin-bottom: 16px;
      }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-emerald-600 selection:text-white">
  <div id="root"></div>

  <script type="module">
    import React, { useState, useEffect, useMemo, useRef } from "https://esm.sh/react@18.2.0";
    import { createRoot } from "https://esm.sh/react-dom@18.2.0/client";
    import {
      Heart, Download, Check, Share2, FolderPlus,
      Copy, Sparkles, X, ChevronLeft, ChevronRight,
      CheckSquare, Square, Loader2, Link2, Eye, Trash2, ZoomIn, Archive
    } from "https://esm.sh/lucide-react@0.292.0";

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import {
      getFirestore, collection, doc, setDoc, updateDoc, deleteDoc, onSnapshot, query
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDFQZi30JoL4A873TntQCxYalRY2QPdcbI",
      authDomain: "chupanhgiare-e4807.firebaseapp.com",
      projectId: "chupanhgiare-e4807",
      storageBucket: "chupanhgiare-e4807.firebasestorage.app",
      messagingSenderId: "1008958227573",
      appId: "1:1008958227573:web:48c30862a2f6a57a74643c",
      measurementId: "G-1M9VCG29VC"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const DEFAULT_DRIVE_API_KEY = "AIzaSyArx0lpJ88MJE-gJFnyWwvAWHawsWIv_kc";

    const DEMO_ALBUMS = [
      {
        id: "demo-pickleball",
        title: "GIẢI PICKLEBALL DOANH NHÂN TRẺ",
        clientName: "Khách hàng Pic",
        studioName: "CHUPANHGIARE STUDIO",
        sourceType: "demo",
        date: "2026-11-15",
        coverUrl: "https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1200&q=85",
        favorites: ["IMG_001.JPG", "IMG_003.JPG"],
        photos: [
          { id: "p1", name: "IMG_001.JPG", thumbUrl: "https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=900&q=80", fullUrl: "https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1800&q=90" },
          { id: "p2", name: "IMG_002.JPG", thumbUrl: "https://images.unsplash.com/photo-1511285560929-80b456fea0bc?auto=format&fit=crop&w=900&q=80", fullUrl: "https://images.unsplash.com/photo-1511285560929-80b456fea0bc?auto=format&fit=crop&w=1800&q=90" },
          { id: "p3", name: "IMG_003.JPG", thumbUrl: "https://images.unsplash.com/photo-1520854221256-17451cc331bf?auto=format&fit=crop&w=900&q=80", fullUrl: "https://images.unsplash.com/photo-1520854221256-17451cc331bf?auto=format&fit=crop&w=1800&q=90" },
          { id: "p4", name: "IMG_004.JPG", thumbUrl: "https://images.unsplash.com/photo-1465495976277-4387d4b0b4c6?auto=format&fit=crop&w=900&q=80", fullUrl: "https://images.unsplash.com/photo-1465495976277-4387d4b0b4c6?auto=format&fit=crop&w=1800&q=90" },
          { id: "p5", name: "IMG_005.JPG", thumbUrl: "https://images.unsplash.com/photo-1537633552985-df8429e8048b?auto=format&fit=crop&w=900&q=80", fullUrl: "https://images.unsplash.com/photo-1537633552985-df8429e8048b?auto=format&fit=crop&w=1800&q=90" },
          { id: "p6", name: "IMG_006.JPG", thumbUrl: "https://images.unsplash.com/photo-1583939003579-730e3918a45a?auto=format&fit=crop&w=900&q=80", fullUrl: "https://images.unsplash.com/photo-1583939003579-730e3918a45a?auto=format&fit=crop&w=1800&q=90" }
        ]
      }
    ];

    function detectLinkType(url) {
      const clean = (url || "").trim();
      if (!clean) return null;
      if (clean.includes("photos.app.goo.gl") || clean.includes("photos.google.com")) {
        return "google_photos";
      }
      if (clean.includes("drive.google.com") || /^[a-zA-Z0-9_-]{20,}$/.test(clean)) {
        return "google_drive";
      }
      return "unknown";
    }

    function extractDriveFolderId(url) {
      if (!url) return null;
      const match1 = url.match(/\/folders\/([a-zA-Z0-9_-]+)/);
      if (match1) return match1[1];
      const match2 = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
      if (match2) return match2[1];
      if (/^[a-zA-Z0-9_-]{20,}$/.test(url.trim())) return url.trim();
      return null;
    }

    // Hàm tải Blob ảnh gốc thông qua Proxy của Netlify
    async function fetchPhotoBlob(photo) {
      const candidates = [
        photo.downloadUrl,
        photo.fullUrl,
        photo.thumbUrl
      ].filter(Boolean);

      for (const url of candidates) {
        try {
          const res = await fetch(url);
          if (res.ok) {
            const blob = await res.blob();
            if (blob && blob.size > 1000) return blob;
          }
        } catch (e) {
          console.warn("Thử nguồn tải tiếp theo:", e);
        }
      }
      throw new Error("Không thể tải dữ liệu ảnh " + photo.name);
    }

    // Kích hoạt tải file trực tiếp xuống bộ nhớ máy (không bung Share Sheet)
    function triggerBrowserDownload(blob, fileName) {
      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.style.display = "none";
      a.href = blobUrl;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        document.body.removeChild(a);
        URL.revokeObjectURL(blobUrl);
      }, 1500);
    }

    function App() {
      const [urlAlbumId] = useState(() => {
        const params = new URLSearchParams(window.location.search);
        return params.get("album");
      });

      const [isAdminMode, setIsAdminMode] = useState(() => {
        const params = new URLSearchParams(window.location.search);
        return !params.get("album");
      });

      const [driveApiKey] = useState(() => {
        return localStorage.getItem("drive_api_key") || DEFAULT_DRIVE_API_KEY;
      });

      const [albums, setAlbums] = useState(DEMO_ALBUMS);
      const [activeAlbumId, setActiveAlbumId] = useState(urlAlbumId || DEMO_ALBUMS[0].id);
      const [selectedIds, setSelectedIds] = useState([]);
      const [filterTab, setFilterTab] = useState("all"); // all | selected | favorites
      const [lightboxIndex, setLightboxIndex] = useState(null);
      const [downloadingState, setDownloadingState] = useState({ active: false, current: 0, total: 0, label: "" });
      const [toastMsg, setToastMsg] = useState(null);

      // Vuốt cảm ứng trên Lightbox
      const touchStartX = useRef(0);
      const touchEndX = useRef(0);

      // Form tạo album mới
      const [newTitle, setNewTitle] = useState("");
      const [newClient, setNewClient] = useState("");
      const [newStudio] = useState("CHUPANHGIARE STUDIO");
      const [sourceLink, setSourceLink] = useState("");
      const [isLoadingSource, setIsLoadingSource] = useState(false);

      const detectedType = useMemo(() => detectLinkType(sourceLink), [sourceLink]);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3500);
      };

      // Kết nối Firebase
      useEffect(() => {
        signInAnonymously(auth).catch((err) => console.warn("Auth warning:", err.message));

        const q = query(collection(db, "albums"));
        const unsub = onSnapshot(q, (snapshot) => {
          const loaded = [];
          snapshot.forEach((docSnap) => {
            loaded.push({ id: docSnap.id, ...docSnap.data() });
          });
          if (loaded.length > 0) {
            loaded.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            setAlbums([...loaded, ...DEMO_ALBUMS]);
            if (urlAlbumId && loaded.some((a) => a.id === urlAlbumId)) {
              setActiveAlbumId(urlAlbumId);
            }
          }
        }, (err) => {
          console.warn("Firestore read note:", err.message);
        });

        return () => unsub();
      }, [urlAlbumId]);

      const currentAlbum = useMemo(() => {
        return albums.find((a) => a.id === activeAlbumId) || albums[0];
      }, [albums, activeAlbumId]);

      const filteredPhotos = useMemo(() => {
        if (!currentAlbum) return [];
        const favs = currentAlbum.favorites || [];
        return currentAlbum.photos.filter((p) => {
          if (filterTab === "selected") return selectedIds.includes(p.id);
          if (filterTab === "favorites") return favs.includes(p.name);
          return true;
        });
      }, [currentAlbum, filterTab, selectedIds]);

      // Điều khiển bàn phím trong bảng xem trước (Lightbox)
      useEffect(() => {
        if (lightboxIndex === null) return;
        const handleKeyDown = (e) => {
          if (e.key === "Escape") setLightboxIndex(null);
          if (e.key === "ArrowRight") setLightboxIndex((prev) => (prev + 1) % filteredPhotos.length);
          if (e.key === "ArrowLeft") setLightboxIndex((prev) => (prev - 1 + filteredPhotos.length) % filteredPhotos.length);
        };
        window.addEventListener("keydown", handleKeyDown);
        return () => window.removeEventListener("keydown", handleKeyDown);
      }, [lightboxIndex, filteredPhotos.length]);

      const toggleSelect = (id, e) => {
        if (e) e.stopPropagation();
        setSelectedIds((prev) =>
          prev.includes(id) ? prev.filter((item) => item !== id) : [...prev, id]
        );
      };

      const toggleSelectAll = () => {
        if (selectedIds.length === filteredPhotos.length && filteredPhotos.length > 0) {
          setSelectedIds([]);
        } else {
          setSelectedIds(filteredPhotos.map((p) => p.id));
        }
      };

      const toggleFavorite = async (photoName, e) => {
        if (e) e.stopPropagation();
        const currentFavs = currentAlbum.favorites || [];
        const updatedFavs = currentFavs.includes(photoName)
          ? currentFavs.filter((n) => n !== photoName)
          : [...currentFavs, photoName];

        setAlbums((prev) =>
          prev.map((alb) =>
            alb.id === currentAlbum.id ? { ...alb, favorites: updatedFavs } : alb
          )
        );

        if (!currentAlbum.id.startsWith("demo-")) {
          try {
            await updateDoc(doc(db, "albums", currentAlbum.id), {
              favorites: updatedFavs
            });
          } catch (err) {
            console.warn("Lỗi lưu tim:", err);
          }
        }
      };

      // Tạo Album từ Google Drive hoặc Google Photos
      const handleCreateAlbum = async (e) => {
        e.preventDefault();
        if (!newTitle.trim() || !sourceLink.trim()) {
          showToast("Vui lòng nhập Tên Album và dán Link Drive hoặc Google Photos!");
          return;
        }

        const linkType = detectLinkType(sourceLink);
        if (!linkType || linkType === "unknown") {
          showToast("Link không hợp lệ! Hãy dán link Google Drive hoặc link chia sẻ Google Photos.");
          return;
        }

        setIsLoadingSource(true);
        try {
          let photos = [];

          if (linkType === "google_drive") {
            const folderId = extractDriveFolderId(sourceLink);
            if (!folderId) throw new Error("Không tìm thấy mã thư mục trong link Google Drive.");

            const queryStr = encodeURIComponent(`'${folderId}' in parents and mimeType contains 'image/' and trashed = false`);
            const apiUrl = `https://www.googleapis.com/drive/v3/files?q=${queryStr}&fields=files(id,name,mimeType)&pageSize=500&orderBy=name&key=${driveApiKey.trim()}`;

            const res = await fetch(apiUrl);
            const data = await res.json();

            if (data.error) throw new Error(data.error.message || "Không đọc được thư mục Drive.");
            if (!data.files || data.files.length === 0) {
              throw new Error("Không tìm thấy ảnh nào! Hãy bật chia sẻ thư mục Drive sang 'Bất kỳ ai có đường liên kết'.");
            }

            photos = data.files.map((f) => ({
              id: f.id,
              name: f.name,
              driveId: f.id,
              thumbUrl: `https://drive.google.com/thumbnail?id=${f.id}&sz=w900`,
              fullUrl: `https://drive.google.com/thumbnail?id=${f.id}&sz=w2400`,
              downloadUrl: `/.netlify/functions/proxy?id=${f.id}&name=${encodeURIComponent(f.name)}`
            }));
          } else if (linkType === "google_photos") {
            const res = await fetch(`/.netlify/functions/photos?url=${encodeURIComponent(sourceLink.trim())}`);
            const data = await res.json();

            if (!res.ok || data.error) {
              throw new Error(data.error || "Không đọc được album Google Photos.");
            }
            if (!data.photos || data.photos.length === 0) {
              throw new Error("Album Google Photos chưa có ảnh hoặc chưa bật chia sẻ link.");
            }

            photos = data.photos.map((item, idx) => {
              const num = String(idx + 1).padStart(3, "0");
              const fileName = `IMG_${num}.JPG`;
              return {
                id: `gp-${idx}-${Date.now()}`,
                name: fileName,
                thumbUrl: `${item.baseUrl}=w900`,
                fullUrl: `${item.baseUrl}=w2400`,
                downloadUrl: `/.netlify/functions/proxy?url=${encodeURIComponent(item.baseUrl + "=d")}&name=${encodeURIComponent(fileName)}`
              };
            });
          }

          const slug = "alb-" + Date.now().toString(36);
          const newAlbumObj = {
            id: slug,
            title: newTitle.trim(),
            clientName: newClient.trim() || "Khách hàng",
            studioName: newStudio,
            sourceType: linkType,
            date: new Date().toISOString().split("T")[0],
            createdAt: Date.now(),
            coverUrl: photos[0].fullUrl,
            favorites: [],
            photos
          };

          await setDoc(doc(db, "albums", slug), newAlbumObj);
          setActiveAlbumId(slug);
          setSelectedIds([]);
          setIsAdminMode(false);
          setNewTitle("");
          setNewClient("");
          setSourceLink("");
          showToast(`Đã tạo Album thành công (${photos.length} ảnh)!`);
        } catch (err) {
          alert("Lỗi kết nối: " + err.message);
        } finally {
          setIsLoadingSource(false);
        }
      };

      // Xóa Album
      const handleDeleteAlbum = async (albumId, albumTitle) => {
        if (albumId.startsWith("demo-")) {
          showToast("Đây là album mẫu mặc định nên không thể xóa!");
          return;
        }
        if (!window.confirm(`Bạn có chắc chắn muốn xóa vĩnh viễn album "${albumTitle}" không?`)) {
          return;
        }
        try {
          await deleteDoc(doc(db, "albums", albumId));
          setAlbums((prev) => prev.filter((a) => a.id !== albumId));
          if (activeAlbumId === albumId) {
            setActiveAlbumId(DEMO_ALBUMS[0].id);
          }
          showToast(`Đã xóa album "${albumTitle}"!`);
        } catch (err) {
          alert("Lỗi khi xóa album: " + err.message);
        }
      };

      // CƠ CHẾ TẢI XUỐNG KIỂU SHOTPIK:
      // - Nếu chọn 1 tấm: Tải thẳng file ảnh gốc về máy ngay lập tức
      // - Nếu chọn nhiều tấm: Đóng gói thành 1 file ZIP và tải thẳng xuống máy
      const handleDownloadPhotos = async (photosToDownload) => {
        if (!photosToDownload || photosToDownload.length === 0) {
          showToast("Vui lòng chọn ít nhất 1 tấm ảnh để tải xuống!");
          return;
        }

        // Trường hợp 1: Tải 1 tấm duy nhất -> Tải thẳng file ảnh
        if (photosToDownload.length === 1) {
          const single = photosToDownload[0];
          setDownloadingState({ active: true, current: 1, total: 1, label: "Đang tải ảnh gốc..." });
          try {
            const blob = await fetchPhotoBlob(single);
            const fileName = /\.(jpg|jpeg|png|webp)$/i.test(single.name) ? single.name : `${single.name}.jpg`;
            triggerBrowserDownload(blob, fileName);
            showToast(`Đã tải xuống ${fileName}!`);
          } catch (err) {
            // Dự phòng mở link tải trực tiếp
            const a = document.createElement("a");
            a.href = single.downloadUrl || single.fullUrl;
            a.download = single.name;
            a.target = "_blank";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
          } finally {
            setDownloadingState({ active: false, current: 0, total: 0, label: "" });
          }
          return;
        }

        // Trường hợp 2: Tải nhiều tấm -> Nén thành 1 file ZIP duy nhất để điện thoại lưu 1 lần không bị chặn
        setDownloadingState({
          active: true,
          current: 0,
          total: photosToDownload.length,
          label: `Đang đóng gói 0/${photosToDownload.length} ảnh...`
        });

        try {
          const zip = new window.JSZip();
          const folderName = (currentAlbum.title || "Album_Anh").replace(/[^a-zA-Z0-9_\-\u00C0-\u1EF9 ]/g, "").trim() || "Album_Anh";
          const imgFolder = zip.folder(folderName);

          for (let i = 0; i < photosToDownload.length; i++) {
            const p = photosToDownload[i];
            setDownloadingState({
              active: true,
              current: i + 1,
              total: photosToDownload.length,
              label: `Đang tải ảnh ${i + 1}/${photosToDownload.length}...`
            });

            try {
              const blob = await fetchPhotoBlob(p);
              const fileName = /\.(jpg|jpeg|png|webp)$/i.test(p.name) ? p.name : `${p.name}.jpg`;
              imgFolder.file(fileName, blob);
            } catch (e) {
              console.warn("Bỏ qua file lỗi:", p.name);
            }
          }

          setDownloadingState({
            active: true,
            current: photosToDownload.length,
            total: photosToDownload.length,
            label: "Đang nén file ZIP..."
          });

          const zipBlob = await zip.generateAsync({ type: "blob" });
          triggerBrowserDownload(zipBlob, `${folderName}_${photosToDownload.length}_anh.zip`);
          showToast(`Đã tải xuống gói ${photosToDownload.length} ảnh (.ZIP)!`);
        } catch (err) {
          alert("Có lỗi khi nén file tải xuống: " + err.message);
        } finally {
          setDownloadingState({ active: false, current: 0, total: 0, label: "" });
        }
      };

      const copyClientLink = (albumId) => {
        const link = `${window.location.origin}/?album=${albumId}`;
        navigator.clipboard.writeText(link);
        showToast("Đã copy Link gửi cho khách! Khách mở link sẽ chỉ thấy trang giao ảnh.");
      };

      const copyFavoriteNames = () => {
        const favs = currentAlbum?.favorites || [];
        if (favs.length === 0) {
          showToast("Khách chưa thả tim tấm ảnh nào!");
          return;
        }
        navigator.clipboard.writeText(favs.join(", "));
        showToast(`Đã copy ${favs.length} mã file ảnh để lọc trong Lightroom!`);
      };

      return React.createElement("div", { className: "min-h-screen flex flex-col pb-24" },
        // Toast thông báo
        toastMsg && React.createElement("div", {
          className: "fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-zinc-900 text-white px-5 py-3 rounded-full shadow-2xl text-xs md:text-sm font-medium flex items-center gap-2 max-w-[92vw]"
        },
          React.createElement(Sparkles, { className: "w-4 h-4 text-emerald-400 shrink-0" }),
          React.createElement("span", null, toastMsg)
        ),

        // Thanh Header Quản trị (Chỉ hiện cho Studio, ẩn khi khách mở link ?album=...)
        !urlAlbumId && React.createElement("header", {
          className: "sticky top-0 z-30 bg-white border-b border-zinc-200 px-4 py-2.5 flex items-center justify-between"
        },
          React.createElement("div", { className: "flex items-center gap-2" },
            React.createElement("span", { className: "font-bold text-base md:text-lg tracking-tight text-zinc-900" },
              currentAlbum?.studioName || "CHUPANHGIARE"
            ),
            React.createElement("span", { className: "text-[10px] px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 font-bold" }, "STUDIO")
          ),
          React.createElement("div", { className: "flex items-center gap-2" },
            React.createElement("button", {
              onClick: () => setIsAdminMode(!isAdminMode),
              className: `px-3 py-1.5 rounded-full text-xs font-semibold transition flex items-center gap-1.5 ${
                isAdminMode ? "bg-zinc-900 text-white" : "bg-zinc-100 text-zinc-800 hover:bg-zinc-200"
              }`
            },
              isAdminMode ? React.createElement(Eye, { className: "w-3.5 h-3.5" }) : React.createElement(FolderPlus, { className: "w-3.5 h-3.5" }),
              isAdminMode ? "Xem Giao Diện Khách" : "Quản Trị / Dán Link"
            ),
